name: Daily scrape

on:
  schedule:
    # Every day at 10:00 UTC (6 AM Toronto during EDT, 5 AM during EST)
    - cron: "0 10 * * *"
  workflow_dispatch:

# Don't let a manual run overlap with the scheduled one
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Without the secret the scraper would silently write to a throwaway SQLite file
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          python -m scripts.run_scraper
